name: ci
on:
  push:
    branches: ["arena/*", main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s worker/tests -t .
        working-directory: workers/stream-py
      # Dockerfile rot check: both images must build; override must parse.
      - run: cp .env.example .env
      - run: docker compose build
      - run: TELEGRAM_API_ID=1 TELEGRAM_API_HASH=dummy docker compose -f docker-compose.yml -f docker-compose.local-api.yml config -q
