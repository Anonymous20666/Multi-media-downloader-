# Pappy/Omega production stack (default path: hosted api.telegram.org, 50MB cap).
#
#   Bot only:      docker compose up -d --build redis controller
#   Bot + group DJ: docker compose up -d --build   (needs STREAM_* in .env)
#   + local Bot API server (2GB uploads): add `-f docker-compose.local-api.yml`
#
# Health stays on loopback — the bot polls Telegram outbound, nothing inbound.
# Full runbook: docs/70-DEPLOY.md.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: &logrot
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  controller:
    build:
      context: .
      dockerfile: apps/controller/Dockerfile
    image: pappy-controller:local
    env_file: [.env]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 768m
    logging: *logrot

  # Group-call DJ engine (ADR-02). Crash-only: without STREAM_SESSION_STRING +
  # API creds it exits after 5 tries and stays down (loud, not looping forever).
  stream-worker:
    build:
      context: .
      dockerfile: workers/stream-py/Dockerfile
    image: pappy-stream-worker:local
    env_file: [.env]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis: { condition: service_healthy }
    restart: on-failure:5
    mem_limit: 1536m
    logging: *logrot

volumes:
  redisdata:
